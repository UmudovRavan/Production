<!DOCTYPE html>
<html lang="az" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altensor Auth Gateway</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/auth-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#D946EF',
                hover: '#C026D3',
                active: '#A21CAF',
                container: '#18181B',
                'on-primary': '#FFFFFF'
              },
              fuchsia: {
                500: '#D946EF',
                600: '#C026D3',
                700: '#A21CAF'
              },
              canvas: '#121214',
              card: '#18181B',
              'card-header': '#141416',
              sidebar: '#18181B',
              input: '#121214',
              modal: '#1C1C1E',
              'modal-header': '#141416',
              border: {
                DEFAULT: '#27272A',
                subtle: '#2C2C2E',
                hover: '#3F3F46',
                focus: '#D946EF'
              }
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              display: ['IBM Plex Sans', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'Consolas', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #121214;
        color: #F4F4F5;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-[#121214] text-[#F4F4F5] font-sans antialiased overflow-x-hidden m-0 p-0 selection:bg-fuchsia-500/30 selection:text-white">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
