    <!-- Early Theme Initialization to prevent FOUC / theme flash on refresh -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('altensor_theme') || localStorage.getItem('desktopTheme') || localStorage.getItem('theme') || 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark', 'midnight');
          root.classList.add(saved);
          if (saved === 'midnight') {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Tailwind CSS CDN -->
